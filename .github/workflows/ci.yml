name: Safe Regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-mcp.lock.txt
      - name: Run public-template safe regression
        run: python scripts/run_full_safe_regression.py --include-pytest
      - name: Upload regression receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safe-regression-report
          path: outputs/regression/full_safe_regression_report.json
          if-no-files-found: error
