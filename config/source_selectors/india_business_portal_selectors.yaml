source: india_business_portal
start_url: https://www.indiabusinessportal.gov.in
listing_card:
  - ".rfq-card"
  - ".lead-card"
  - ".opportunity-card"
  - ".card"
  - "tr"
fields:
  tender_id: [".rfq-id", ".lead-id", ".id", "td:nth-child(1)"]
  title: [".rfq-title", ".lead-title", ".title", "td:nth-child(2)"]
  buyer: [".buyer", ".exporter", ".organisation", "td:nth-child(3)"]
  deadline: [".deadline", ".expiry-date", "td:nth-child(4)"]
  value: [".value", ".amount", "td:nth-child(5)"]
  detail_link: ["a.detail-link", "a[href*='rfq']", "a[href*='lead']"]
  document_link: ["a.document-link", "a[href$='.pdf']", "a[href*='download']"]
  corrigendum_link: ["a.corrigendum-link", "a[href*='corrigendum']"]
  boq_link: ["a.boq-link", "a[href*='boq']"]
unsafe_actions: [submit, upload, pay, declaration]
