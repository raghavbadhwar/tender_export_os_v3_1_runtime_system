version: 1
profile: tender-export-os
policy: read_only_provenance_first

sources:
  - id: supplied_recovered_source_tree
    kind: source_checkout
    path: "/Volumes/ANUJ SSD 2/RAGHAV2_RECOVERED_FINAL_2026-07-11/CONSOLIDATED_ORIGINAL_TREE/hermes"
    observed_version: "0.14.0"
    authority: design_evidence_only
    notes: "Ares Wholesale AIOS source and operating patterns; not a live profile backup."
  - id: local_ares_runtime_state
    kind: legacy_runtime
    path: "/Users/raghav/.ares"
    observed_version: "0.14-era"
    authority: historical_evidence_only
    contains:
      - 52 legacy sessions
      - 754 legacy messages
      - bounded MEMORY.md and USER.md
      - a-soul profile instructions
      - legacy cron definitions
