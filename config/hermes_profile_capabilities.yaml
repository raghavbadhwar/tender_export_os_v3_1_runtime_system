  minimum_mature_calibration_sample: 30
  required_tracking:
    - forecast_date
    - eligible_for_backtest_at
    - feature_snapshot_json
    - predicted_probability
    - model_version
    - observed_outcome
    - maturity_status
    - brier_component

optional_capabilities_not_enabled:
  messaging_gateway: "No owner-approved Telegram/Slack/etc credentials are configured; delivery remains local."
  web_extract_api: "No supported extraction API credential is configured; use browser/public source adapters where allowed."
  cross_provider_fallback: "The verified same-account gpt-5.5 fallback is active; a cross-provider fallback still requires an owner-approved provider and cost envelope."
  temporal: "Not justified at the current workflow volume; Hermes cron, the job supervisor, checkpoints, and the event ledger already provide the needed continuity."
  postgres_pgvector: "Not justified for the current small rebuildable ledgers; add only after a measured query or retrieval bottleneck."
  langfuse_remote_tracing: "Not justified while local events, receipts, capability audits, and repeated behavioral evaluations remain sufficient."
  browsertrix_and_changedetection: "Existing hashed public capture, screenshots, source adapters, and scheduled corrigenda checks already cover the present evidence/monitoring need."
  docling_and_paddleocr: "Heavy local models are deferred until real scan/layout failures exceed the current PyMuPDF/pdfplumber/OCR fallback lane."

# High-risk or cost-bearing runtime services are deliberately not part of the
# default capability set. Each individual activation needs every gate below;
# an attractive feature, a one-off blocked source, or an agent suggestion is
# never enough to turn one on.
restricted_capability_activation:
  default_status: DISABLED
  decision_rule: "ALL activation requirements must be evidenced for the named capability, then the owner must approve an exact provider, scope, budget cap, retention plan, and rollback date."
  explicitly_not_authorized:
    - bypassing robots, login, CAPTCHA, paywalls, portal terms, or source access controls
    - importing cookies, browser profiles, credentials, or private source data into a third party
    - enabling a broad MCP server or provider-wide tool catalog
    - automatic external sends, submissions, payments, DSC use, or commercial commitments
  common_activation_requires: &restricted_activation_requires
    measured_capture_failure_rate:
      required: true
      threshold: ">=20% eligible public captures fail after adapter repair across at least 100 attempts and 30 consecutive days; expected login/CAPTCHA/paywall stops are excluded."
      evidence: "source-health rows, canary receipts, and a dated failure analysis"
    operator_hours_lost:
      required: true
      threshold: ">=20 verified operator hours per calendar month are lost to the same bounded capture problem after local adapter remediation."
      evidence: "time log linked to source/case IDs and remediation attempts"
    monthly_volume:
      required: true
      threshold: ">=500 eligible public pages or evidence packets per month for the named workflow, with a documented throughput bottleneck."
      evidence: "event-ledger/run-log aggregate and demand forecast for the next 90 days"
    privacy_review:
      required: true
      threshold: "PASS: owner-reviewed data-flow, retention, vendor terms/DPA, geographic processing, secret handling, and redaction assessment; private evidence remains outside the provider unless separately approved."
      evidence: "dated privacy review with named owner and rollback/deletion procedure"
    owner_approved_budget:
      required: true
      threshold: "Exact-scope owner approval naming the provider, use case, monthly cap, trial end date, permitted inputs, and immediate disable/rollback path."
      evidence: "approval receipt with scope hash and budget cap"
  capabilities:
    paid_extraction_services:
      status: DISABLED
      examples: [Firecrawl, Tavily, Exa, Parallel, Nous Tool Gateway extraction]
      permitted_trial_scope: "One named public-source capture gap, read-only evidence only, no credentials or private documents."
      activation_requires: *restricted_activation_requires
    cloud_browser_services:
      status: DISABLED
      examples: [Browserbase, Browser Use cloud browser, remote managed browser]
      permitted_trial_scope: "One owner-approved public read-only browser workflow; no portal login, form interaction, or sensitive session persistence."
      activation_requires: *restricted_activation_requires
    residential_proxy_services:
      status: DISABLED
      examples: [residential proxy network, rotating proxy service]
      permitted_trial_scope: "No default trial. Any future proposal must remain legal, terms-compliant, public-read-only, and explicitly reject access-control circumvention."
      activation_requires: *restricted_activation_requires
    general_third_party_mcp_services:
      status: DISABLED
      examples: [unscoped external MCP gateway, provider-wide MCP catalog, third-party action MCP]
      permitted_trial_scope: "One pinned, least-privilege tool allowlist with a local policy wrapper and no execution tool exposure."
      activation_requires: *restricted_activation_requires

