local_capabilities:
  model_resilience:
    policy: config/model_routing_policy.yaml
    fallback_chain:
      - {provider: openai-codex, model: gpt-5.5}
    credential_reuse: openai_codex_oauth
    activation_conditions: [rate_limit, overload, service_error, connection_failure]
  filesystem_checkpoints:
    enabled: true
    max_snapshots: 12
    max_total_size_mb: 300
    max_file_size_mb: 10
    auto_prune: true
    retention_days: 7
    delete_orphans: true
    min_interval_hours: 24
  deterministic_security:
    website_blocklist_enabled: true
    website_blocklist_domains: [mail.google.com, gmail.com]
    terminal_deny_globs:
      - "git push --force*"
      - "git push -f *"
      - "gws *"
      - "*/gws *"
      - "himalaya *"
      - "*/himalaya *"
  behavioral_evaluation:
    spec: config/hermes_behavioral_eval.yaml
    runner: scripts/evaluate_hermes_behavioral_contracts.py
    statistical_repeats: 3
    minimum_case_pass_rate: 1.0
    toolsets: clarify
    latest_report_glob: outputs/hermes_behavioral_eval/HBEVAL-*/report.json
    required_status: PASS
    max_age_hours: 168
  web_search:
    backend: ddgs
    api_key_required: false
    extraction_support: false
    fallback_for: broad_public_discovery
  browser:
    engine: agent-browser
    mode: read_only_public_evidence
    raw_evidence_root: outputs/evidence/private/agent_browser
    redacted_evidence_root: outputs/evidence/redacted/agent_browser
  web_scraping:
    config: config/public_web_scraping.yaml
    static_batch: scripts/public_web_evidence_scraper.py
    javascript_rendered: scripts/agent_browser_capture.py
    robots_enforced: true
    public_https_only: true
    raw_evidence_root: outputs/evidence/private/web_scraping
  governed_mcp:
    server_name: tender_os
    transport: stdio
    command: /Users/raghav/Downloads/tender_export_os_v3_1_runtime_system/.venv/bin/python
    server_script: scripts/tender_os_mcp_server.py
    runtime_requirements: requirements-mcp.txt
    supports_parallel_tool_calls: false
    sampling_enabled: false
    elicitation_enabled: false
    resources_enabled: false
    prompts_enabled: false
    tools:
      - capability_status
      - get_case
      - search_cases
      - assess_opportunity
      - get_source_health
      - parse_local_documents
      - capture_public_web
      - get_approval_status
      - evaluate_business_action
      - stage_case_transition
      - attach_case_evidence
      - stage_supplier_candidate
      - record_quote_proof_review
      - create_internal_approval_card
      - record_case_outcome
      - stage_learning_proposal
      - reconcile_projection_from_receipt
    external_execution_tools_exposed: false
    policy_engine: opa
    policy_binary: opa
    policy_config: config/tender_tool_policy.yaml
    policy_file: policies/tender_os_authorization.rego
    result_schema: config/schemas/mcp_tool_result.schema.json
    decision_event_type: policy.decision_recorded
    decision_event_source: opa_local
    decision_event_file: data/events.jsonl
  computer_use:
    driver: cua-driver
    installed_version: 0.7.1
    readiness: ready
    required_permissions: [accessibility, screen_recording]
  plugins:
    enabled:
      - security-guidance
    policy: focused_opt_in_only

gateway_hooks:
