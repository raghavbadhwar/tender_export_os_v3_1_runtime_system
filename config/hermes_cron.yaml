version: 4.1
timezone: Asia/Kolkata
owner_gateway: local
default_delivery_fallback: local_file

rules:
  use_hermes_cron_first: true
  route_executable_jobs_through_supervisor: true
  require_job_receipt_and_event_pair: true
  fail_job_when_task_exit_is_nonzero: true
  no_external_money_legal_or_dsc_actions_without_approval: true
  no_recursive_cron_creation: true
  use_skill_backed_cron_jobs: true
  save_local_report_if_gateway_missing: true
  deliver_scheduled_briefs_to_telegram: false

jobs:
  - id: core_source_agent_browser_radar
    enabled: true
    cadence: "30 5 * * *"
    local_time: "05:30 IST daily"
    runtime: hermes_no_agent_script
    max_runtime_minutes: 8
    purpose: "Capture GeM, CPPP, and UNGM through the read-only agent-browser evidence lane before the morning pipeline."
    command: ".venv/bin/python scripts/teos_job_supervisor.py --job-id core_source_agent_browser_radar"
    task_command: "python3 scripts/run_agent_browser_core_sources.py --sources gem,cppp,ungm --record-event"
    run_log_agent: teos_job_supervisor
    stop_condition: "Read-only public evidence only; no click, login, form fill, submit, upload, message, payment, DSC, or commercial commitment."
    outputs:
      - outputs/core_source_browser/
      - outputs/agent_browser/
  - id: morning_opportunity_intelligence_html
    enabled: true
    cadence: "0 6 * * *"
    local_time: "06:00 IST daily"
    runtime: hermes_no_agent_script
    max_runtime_minutes: 3
    purpose: "Run the founder-requested morning pipeline: public/source intake, requirements pass, supplier 5-3-2 pass, supply-chain document drafts, pricing/quote assistance, blind-spot routing, and HTML report delivery."
    command: ".venv/bin/python scripts/teos_job_supervisor.py --job-id morning_opportunity_intelligence_html"
    task_command: "python3 scripts/run_morning_opportunity_intelligence.py"
    run_log_agent: teos_job_supervisor
    stop_condition: "Internal report generation only; no portal login, supplier/buyer message, bid/RFQ submission, document upload, payment, DSC, final classification/origin claim, or final price/terms commitment."
    outputs:
      - outputs/opportunity_intelligence/daily_opportunity_intelligence_YYYYMMDD.html
      - outputs/opportunity_intelligence/daily_opportunity_intelligence_YYYYMMDD.json
      - outputs/supply_chain/supply_chain_<case_id>_YYYYMMDD.md
      - outputs/external_intake/external_intake_report_YYYYMMDD_HHMMSS.md
      - data/agent_run_log.csv
  - id: morning_operator_brief
    enabled: true
    cadence: "30 8 * * *"
    local_time: "08:30 IST daily"
    runtime: hermes_default
    max_runtime_minutes: 20
    purpose: "Generate the canonical internal operating-desk control tower from cases, approvals, source/plugin health, and agent run state."
    stop_condition: "Public read-only intake and owner Telegram delivery only; no external business action without approval."
    external_intake:
      command: "python3 scripts/run_external_task_intake.py --limit 8 --timeout 12 --record-event"
      mode: "public_read_only_plus_local_external_task_inbox"
    outputs:
      - outputs/operating_desk/operating_desk_YYYYMMDD.html
      - outputs/operating_desk/operating_desk_YYYYMMDD.json
      - data/agent_run_log.csv
    command: ".venv/bin/python scripts/teos_job_supervisor.py --job-id morning_operator_brief"
    task_command: "python3 scripts/generate_operating_desk_report.py"
    run_log_agent: teos_job_supervisor
  - id: v5_demand_forecast_low_competition_shadow
    enabled: true
    cadence: "15 7 * * *"
    local_time: "07:15 IST daily"
    runtime: hermes_no_agent_script
    max_runtime_minutes: 5
    purpose: "Shadow-run the V5 demand forecast and low-competition intelligence report. Internal-only; no external actions."
    command: ".venv/bin/python scripts/teos_job_supervisor.py --job-id v5_demand_forecast_low_competition_shadow"
    task_command: "python3 scripts/run_v5_shadow_cycle.py"
    run_log_agent: teos_job_supervisor
    stop_condition: "Local projection/report generation only; no buyer/supplier contact, portal login, bid/RFQ submission, document upload, payment, DSC, final classification/origin claim, or final price/terms commitment."
    outputs:
      - data/buyer_purchase_history.csv
      - data/category_demand_history.csv
      - data/forecast_candidates.csv
      - data/forecast_backtests.csv
      - outputs/demand_forecasting/forecast_calibration_YYYYMMDD.json
      - outputs/demand_forecasting/forecast_calibration_YYYYMMDD.md
      - outputs/demand_forecasting/v5_demand_forecast_low_competition_YYYYMMDD.md
      - outputs/demand_forecasting/v5_demand_forecast_low_competition_YYYYMMDD.html
      - outputs/demand_forecasting/v5_demand_forecast_low_competition_YYYYMMDD.json
  - id: midday_opportunity_radar
    enabled: true
    cadence: "0 13 * * *"
    local_time: "13:00 IST daily"
    runtime: hermes_plus_codex_when_needed
    max_runtime_minutes: 60
    purpose: "Canary-test non-mock GOV and EXPORT public sources in evidence-only mode and fail truthfully if no adapter returns an evidence-backed record."
    stop_condition: "Stop on CAPTCHA, paywall, login wall, duplicate case, unreadable evidence, weak citations, or approval gate."
    external_intake:
      command: "python3 scripts/run_external_task_intake.py --limit 12 --timeout 12 --record-event"
      mode: "public_read_only_plus_local_external_task_inbox"
    outputs:
      - outputs/source_canary/
      - data/source_health.csv
      - data/agent_run_log.csv
    command: ".venv/bin/python scripts/teos_job_supervisor.py --job-id midday_opportunity_radar"
    task_command: "python3 scripts/run_live_source_canary.py --adapters cppp,ungm,gem --limit 3 --timeout 180"
    run_log_agent: teos_job_supervisor
  - id: supplier_followup_review
    enabled: true
    cadence: "0 17 * * *"
    local_time: "17:00 IST daily"
    runtime: hermes_default
    max_runtime_minutes: 30
    purpose: "Check pending supplier quotes, external task inbox items, supplier risk, and blocked cases. Do not send reminders without approval."
    stop_condition: "No supplier reminder, quote request, buyer reply, or external follow-up without owner approval."
    external_intake:
      command: "python3 scripts/run_external_task_intake.py --limit 6 --timeout 12 --record-event"
      mode: "public_read_only_plus_local_external_task_inbox"
    outputs:
      - outputs/intraday_monitor/
      - data/agent_run_log.csv
    command: ".venv/bin/python scripts/teos_job_supervisor.py --job-id supplier_followup_review"
    task_command: "python3 scripts/generate_intraday_monitor.py"
    run_log_agent: teos_job_supervisor
  - id: buyer_reply_monitor
    enabled: true
    cadence: "*/30 9-21 * * *"
    local_time: "Every 30 minutes, 09:00–21:59 IST"
    runtime: hermes_no_agent_script
    max_runtime_minutes: 2
    purpose: "Ingest structured Gmail-plugin buyer reply packets, classify them, enforce opt-out/bounce stops, and prepare an owner action brief."
    command: ".venv/bin/python scripts/teos_job_supervisor.py --job-id buyer_reply_monitor"
    task_command: "python3 scripts/generate_buyer_reply_monitor.py --process-inbox --record-event"
    run_log_agent: teos_job_supervisor
    stop_condition: "Gmail plugin input only. Never use gws/IMAP/Himalaya for Gmail; never auto-reply, follow up, quote, or make commitments."
    outputs:
      - outputs/buyer_replies/
      - data/communication_log.csv
      - data/outreach_queue.csv
  - id: evening_execution_close
    enabled: true
    cadence: "30 20 * * *"
    local_time: "20:30 IST daily"
    runtime: hermes_default
    max_runtime_minutes: 30
    purpose: "Close the day, reconcile external intake, update Kanban, list blockers, approvals, and tomorrow first action."
    stop_condition: "No new external business action; unresolved gates roll into the next owner brief."
    external_intake:
      command: "python3 scripts/run_external_task_intake.py --limit 6 --timeout 12 --record-event"
      mode: "public_read_only_plus_local_external_task_inbox"
    outputs:
      - outputs/operating_desk/operating_desk_YYYYMMDD.html
      - outputs/operating_desk/operating_desk_YYYYMMDD.json
      - data/agent_run_log.csv
    command: ".venv/bin/python scripts/teos_job_supervisor.py --job-id evening_execution_close"
    task_command: "python3 scripts/generate_operating_desk_report.py"
    run_log_agent: teos_job_supervisor
  - id: weekly_learning_review
    enabled: true
    cadence: "0 18 * * 5"
    local_time: "Friday 18:00 IST"
    runtime: hermes_plus_chatgpt_snapshot
    max_runtime_minutes: 60
    purpose: "Review wins, losses, rejections, external source quality, external task intake quality, supplier quality, pricing errors, and owner corrections. Propose memory, skill, source-adapter, and rule updates."
    approval_required: true
    stop_condition: "Stage proposed changes only; skill, memory, pricing, compliance, schedule, and source-adapter patches require approval unless purely safe validation/reporting."
    external_intake:
      command: "python3 scripts/run_external_task_intake.py --limit 10 --timeout 12 --record-event"
      mode: "public_read_only_plus_local_external_task_inbox"
    outputs:
      - outputs/regression/operating_firm_test_matrix_YYYYMMDDHHMMSS.json
      - data/agent_run_log.csv
    command: ".venv/bin/python scripts/teos_job_supervisor.py --job-id weekly_learning_review"
    task_command: "python3 scripts/run_operating_firm_test_matrix.py --skip-codex"
    run_log_agent: teos_job_supervisor
  - id: monthly_strategy_deep_research
    cadence: "owner-approved"
    local_time: "Manual/monthly"
    runtime: chatgpt_project
    max_runtime_minutes: 180
    purpose: "Deep research on export categories, procurement categories, foreign procurement sources, and business model changes."
    approval_required: true
    stop_condition: "Research only; no operational execution or final compliance authority."
    outputs:
      - outputs/chatgpt_bridge/
      - data/agent_run_log.csv
