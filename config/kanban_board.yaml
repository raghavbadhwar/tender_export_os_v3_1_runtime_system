version: 5
board:
  slug: tender-export-os
  name: Tender Export OS
  purpose: "Durable operating board for government tender, export RFQ, supplier sourcing, pricing, compliance, document production, approvals, execution tracking, source health, plugin health, and weekly learning."

statuses:
  - triage
  - todo
  - ready
  - running
  - blocked
  - done
  - archived

profiles:
  - id: tender-export-os
    role: "Owner-facing chief console, approval desk, Codex artifact routing, and final internal readiness review."
  - id: teos-orchestrator
    role: "Routing-only decomposition of top-level work into typed specialist tasks."
  - id: gov-tender-intelligence
    role: "Government tender discovery, fast-kill critique, deep read, source health, corrigenda, and repeat-buyer intelligence."
  - id: export-buyer-intelligence
    role: "Export market research, buyer verification, RFQ proof, and demand hypotheses."
  - id: supplier-commercial
    role: "Supplier 5-3-2, candidate verification, and strict quote-proof readiness."
  - id: pricing-risk
    role: "Cost waterfalls, working capital, L1 sensitivity, margins, and pricing scenarios."
  - id: compliance-due-diligence
    role: "Draft-only eligibility, DGFT/SCOMET, candidate classification, origin, and compliance gaps."
  - id: relationship-ops
    role: "Approved communication packets, reply classification, opt-outs, and follow-up timing; no send authority."
  - id: learning-evaluation
    role: "Outcome review, source/supplier performance, forecast evaluation, and governed learning proposals."

routing:
  decomposition_profile: teos-orchestrator
  owner_approval_profile: tender-export-os
  compatibility_aliases_allowed_as_assignees: false
  codex_artifact_lane: tender-export-os

task_templates:
  - GOV Tender Intake
  - GOV Deep Read
  - Export RFQ Intake
  - Export Buyer Verification
  - Supplier Sourcing
  - Pricing Proof
  - Compliance Review
  - Artifact Production
  - Approval Required
  - Execution Tracking
  - Operating Desk Review
  - Weekly Review
  - Source Health Issue
  - Plugin Health Issue
  - ChatGPT Research Request

required_fields:
  - case_id
  - workflow_type
  - source
  - status
  - assignee
  - next_action
  - deadline
  - owner_approval_needed
  - drive_artifact_links
  - comments_or_handoff_notes

safety:
  external_effects_allowed_from_board: false
  approval_card_required_for_gated_actions: true
  receipt_required_after_approved_execution: true
  compatibility_aliases_allowed_as_assignees: false
