version: 4
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: true

skills:
  write_approval: true

display:
  memory_notifications: verbose

save_to_memory:
  - durable founder preferences
  - repeated corrections
  - workflow rules that affect future runs
  - source quirks
  - supplier lessons summarized compactly
  - category preferences
  - important tool/runtime quirks
  - approval preferences

do_not_save_to_memory:
  - raw tenders
  - raw RFQs
  - long supplier tables
  - full documents
  - passwords
  - credentials
  - DSC files
  - bank details
  - sensitive contract details
  - temporary paths
  - one-off facts
  - raw buyer or supplier email bodies
  - private contact dumps or contact lists
  - personal email addresses, phone numbers, or direct-message contents
  - full communication threads or unredacted reply snippets

relationship_memory:
  register: data/relationship_memory.csv
  profile_scope: relationship-ops
  write_approval: true
  allowed_memory_types:
    - COMMUNICATION_PREFERENCE
    - OPT_OUT
    - RECURRING_OBJECTION
    - OWNER_CORRECTION
  required_verification_status: VERIFIED
  evidence_rule: retain only metadata-only connector receipts or owner evidence references; never copy raw message content
  no_auto_promotion_from_reply_classification: true
  expiry_rule: opt-outs remain active until the owner records a verified superseding correction; other entries require an explicit review/expiry date

skill_update_triggers:
  - workflow repeated 3+ times
  - founder correction changes future behavior
  - source parser fix becomes reusable
  - pricing rule improves
  - supplier verification rule improves
  - compliance check improves
  - daily or weekly loop changes

skill_update_policy:
  stage_for_approval: true
  never_patch_pricing_or_compliance_skills_without_owner_approval: true
