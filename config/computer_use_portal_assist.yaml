version: 1
purpose: "Computer Use readiness and portal-assist boundary for Tender Export OS."
portal_assist_enabled: false
mode: MANUAL_OBSERVABLE_CASE_SCOPED_ONLY

required_before_portal_assist:
  - hermes_doctor_pass
  - computer_use_status_pass
  - computer_use_doctor_pass
  - read_only_canary_receipt
  - owner_case_scope_approval
  - human_observable_session

forbidden_actions:
  - bid_submission
  - document_upload
  - payment
  - DSC_or_esignature
  - CAPTCHA_bypass
  - final_price_commitment
  - delivery_commitment
  - classification_or_origin_claim

canary_contract:
  required_approval_action: computer_use_read_only_canary
  read_only_only: true
  public_or_owner_opened_page_only: true
  no_form_submit: true
  no_file_upload: true
  no_login_without_owner_present: true
  no_credential_storage: true
  receipt_required: true
  receipt_directory: receipts/computer_use_canaries
  allowed_action: PUBLIC_PAGE_OBSERVATION
