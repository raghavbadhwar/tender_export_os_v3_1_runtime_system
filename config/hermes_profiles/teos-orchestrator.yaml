model:
  default: gpt-5.6-terra
  provider: openai-codex
mcp_discovery_timeout: 20
agent:
  max_turns: 12
  verify_on_stop: true
  reasoning_effort: high
terminal:
  backend: local
  cwd: /Users/raghav/Downloads/tender_export_os_v3_1_runtime_system
  timeout: 120
kanban:
  dispatch_in_gateway: false
  auto_decompose: false
  auto_promote_children: false
memory:
  memory_enabled: false
  user_profile_enabled: false
  write_approval: true
skills:
  guard_agent_created: true
  write_approval: true
approvals:
  mode: manual
  cron_mode: deny
  deny: ["gws *", "*/gws *", "himalaya *", "*/himalaya *"]
security:
  allow_private_urls: false
  redact_secrets: true
  website_blocklist:
    enabled: true
    domains: [mail.google.com, gmail.com]
plugins:
  enabled: []
  disabled: []
mcp_servers:
  tender_os:
    command: /Users/raghav/Downloads/tender_export_os_v3_1_runtime_system/.venv/bin/python
    args: [/Users/raghav/Downloads/tender_export_os_v3_1_runtime_system/scripts/tender_os_mcp_server.py]
    enabled: true
    timeout: 300
    connect_timeout: 60
    supports_parallel_tool_calls: false
    sampling: {enabled: false}
    elicitation: {enabled: false}
    tools:
      include: [capability_status, stage_case_transition, attach_case_evidence, create_internal_approval_card, reconcile_projection_from_receipt]
      resources: false
      prompts: false
platform_toolsets:
  cli: [kanban, todo, skills]
