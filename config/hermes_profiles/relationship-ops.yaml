model:
  default: gpt-5.6-terra
  provider: openai-codex
mcp_discovery_timeout: 20
agent:
  max_turns: 20
  verify_on_stop: true
  reasoning_effort: high
terminal:
  backend: local
  cwd: /Users/raghav/Downloads/tender_export_os_v3_1_runtime_system
  timeout: 300
kanban:
  dispatch_in_gateway: false
  auto_decompose: false
  auto_promote_children: false
memory:
  memory_enabled: true
  user_profile_enabled: false
  write_approval: true
  relationship_register: data/relationship_memory.csv
  relationship_policy: config/relationship_memory_policy.yaml
  allowed_relationship_memory_types: [COMMUNICATION_PREFERENCE, OPT_OUT, RECURRING_OBJECTION, OWNER_CORRECTION]
  prohibited_relationship_memory: [raw_email_bodies, private_contact_dumps, direct_contact_identifiers, credentials]
skills:
  guard_agent_created: true
  write_approval: true
approvals:
  mode: manual
  cron_mode: deny
  deny: ["gws *", "*/gws *", "himalaya *", "*/himalaya *"]
security:
  allow_private_urls: false
  redact_secrets: true
  website_blocklist:
    enabled: true
    domains: [mail.google.com, gmail.com]
plugins:
  enabled: []
  disabled: []
mcp_servers:
  tender_os:
    command: /Users/raghav/Downloads/tender_export_os_v3_1_runtime_system/.venv/bin/python
    args: [/Users/raghav/Downloads/tender_export_os_v3_1_runtime_system/scripts/tender_os_mcp_server.py]
    enabled: true
    timeout: 300
    connect_timeout: 60
    supports_parallel_tool_calls: false
    sampling: {enabled: false}
    elicitation: {enabled: false}
    tools:
      include: [get_case, search_cases, get_approval_status, evaluate_business_action]
      resources: false
      prompts: false
platform_toolsets:
  cli: [file, skills, memory, session_search, todo]
