version: 1
purpose: "Approval-ready design packet for a strictly case-scoped official buyer contact-form connector."
status: DRAFT_APPROVAL_REQUIRED
production_enabled_by_this_design: false
approval:
  approval_id: ""
  approved_at: ""
  approved_by: ""

scope:
  allowed_use: "Submit an owner-approved message through a known official buyer contact form when no verified public email is available."
  case_scoped_only: true
  one_submission_per_approval: true
  allowed_domains: []
  allowed_case_ids: []

required_inputs_per_submission:
  - case_id
  - approval_id
  - approval_receipt
  - recipient_organization
  - official_contact_form_url
  - domain_allowlist_match
  - exact_form_field_map
  - message_subject
  - message_body
  - content_sha256
  - idempotency_key

exact_form_field_map_schema:
  url: "https://example.gov/contact"
  fields:
    name: "field selector or field name"
    email: "field selector or field name"
    phone: "field selector or field name"
    subject: "field selector or field name"
    message: "field selector or field name"
  submit_control: "submit selector"
  success_confirmation_selector: "selector or text pattern"

runtime_controls:
  domain_allowlist_required: true
  exact_form_field_map_required: true
  screenshot_receipt_required: true
  html_receipt_required: true
  content_hash_required: true
  idempotency_key_required: true
  anti_csrf_session_handling_required: true
  human_captcha_stop_required: true
  post_submit_confirmation_required: true
  owner_approval_receipt_required: true
  prior_receipt_duplicate_check_required: true

hard_stops:
  unrestricted_form_automation_allowed: false
  captcha_bypass_allowed: false
  credential_capture_allowed: false
  login_required_forms_allowed: false
  payment_or_purchase_allowed: false
  portal_upload_allowed: false
  tender_bid_submit_allowed: false
  final_quote_or_commitment_allowed: false
  public_service_exposure_allowed: false

receipt_contract:
  write_before_submit_packet: true
  write_after_submit_receipt: true
  receipt_dir: receipts/contact_form_submissions
  required_receipt_fields:
    - case_id
    - approval_id
    - official_contact_form_url
    - submitted_content_sha256
    - idempotency_key
    - screenshot_path
    - html_path
    - confirmation_text_or_selector
    - submitted_at
    - external_action_executed

implementation_boundary:
  note: "This design is a prerequisite artifact only. It does not enable production execution."
