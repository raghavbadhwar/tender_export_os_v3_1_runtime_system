version: 1
policy_name: tender-os-hermes-tool-authorization
default_effect: deny
opa_package: data.tenderos.authz.decision
approval_register: data/approvals_receipts.csv
approval_max_age_hours: 48
require_owner_decision_receipt: true
require_scope_hash: true
reject_reused_approval_after_external_effect: true

# T0-T2 are the only capabilities exposed by the MCP server. T3-T5 exist here
# so Hermes can ask for a deterministic policy decision and prepare an approval
# packet, but no execution tool is registered for those actions.
actions:
  mcp.capability_status:
    tier: 0
    mode: internal_read
    external_effect: false
    approval_required: false
  mcp.get_case:
    tier: 0
    mode: internal_read
    external_effect: false
    approval_required: false
  mcp.search_cases:
    tier: 0
    mode: internal_read
    external_effect: false
    approval_required: false
  mcp.get_source_health:
    tier: 0
    mode: internal_read
    external_effect: false
    approval_required: false
  mcp.get_approval_status:
    tier: 0
    mode: internal_read
    external_effect: false
    approval_required: false
  mcp.evaluate_business_action:
    tier: 0
    mode: internal_read
    external_effect: false
    approval_required: false
  mcp.capture_public_web:
    tier: 1
    mode: public_read_only
    external_effect: false
    approval_required: false
  mcp.assess_opportunity:
    tier: 2
    mode: advisory
    external_effect: false
    approval_required: false
  mcp.parse_local_documents:
    tier: 2
    mode: internal_evidence_write
    external_effect: false
    approval_required: false

  portal_login_for_research:
    tier: 3
    mode: credentialed_prepare
    external_effect: true
    approval_required: true
  portal_signup_for_research:
    tier: 3
    mode: credentialed_prepare
    external_effect: true
    approval_required: true
  portal_credential_creation:
    tier: 3
    mode: credentialed_prepare
    external_effect: true
    approval_required: true
  portal_session_refresh_for_research:
    tier: 3
    mode: credentialed_prepare
    external_effect: true
    approval_required: true

  send_supplier_quote_request:
    tier: 4
    mode: external_message
    external_effect: true
    approval_required: true
    aliases: [send_supplier_quote_requests]
  send_supplier_clarification_request:
    tier: 4
    mode: external_message
    external_effect: true
    approval_required: true
  send_supplier_follow_up:
